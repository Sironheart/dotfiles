[settings]
experimental = true
disable_backends = ["ubi"]
pipx.uvx = true
python.uv_venv_auto = true
minimum_release_age = "7d"
lockfile = true

trusted_config_paths = ['~/projects']

[settings.github]
use_git_credentials = true

[tools]
go = "latest"
just = "latest"
lazygit = "latest"
rust = "latest"
node = "latest"
k9s = "latest"
atuin = "latest"
bat = "latest"
chezmoi = "latest"
eza = "latest"
fd = "latest"
gh = "latest"
helm = "latest"
kubectl = "latest"
neovim = "latest"
opencode = "latest"
"1password-cli" = "latest"
ripgrep = "latest"
starship = "latest"
yq = "latest"
zoxide = "latest"
