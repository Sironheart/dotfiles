[settings]
experimental = true
disable_backends = ["ubi"]
python.uv_venv_auto = "create|source"
minimum_release_age = "7d"
lockfile = true
use_versions_host_track = false
dotnet.cli_telemetry_optout = true
skills.fetch = false

trusted_config_paths = ['~/projects']

[settings.github]
use_git_credentials = true

[bootstrap.mise_shell_activate]
fish = "activate"

[tools]
go = "latest"
just = "latest"
lazygit = "latest"
rust = "latest"
node = "latest"
atuin = "latest"
bat = "latest"
chezmoi = "latest"
eza = "latest"
fd = "latest"
gh = "latest"
helm = "latest"
kubectl = "latest"
neovim = "latest"
opencode = "latest"
oxfmt = "latest"
ripgrep = "latest"
sofka = "latest"
starship = "latest"
yq = "latest"
zoxide = "latest"
